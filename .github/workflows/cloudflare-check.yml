name: Cloudflare checks
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npx wrangler d1 execute darianspalla-production --local --file cloudflare/schema.sql
      - run: node scripts/seed-local.mjs
      - run: npx wrangler d1 execute darianspalla-production --local --file /tmp/darian-test/seed.sql
      - run: npm test
