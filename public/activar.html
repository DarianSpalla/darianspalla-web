<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex"><title>Activar cuenta · Darian Spalla</title><style>body{margin:0;background:#111;color:#eee;font:16px system-ui;display:grid;min-height:100vh;place-items:center}main{max-width:420px;padding:32px}label,input,button{display:block;width:100%;box-sizing:border-box}input,button{padding:14px;margin:12px 0;border-radius:8px;border:1px solid #777}button{background:#c8a55a;color:#111;cursor:pointer}a{color:#c8a55a}</style></head><body><main><h1>Activá tu cuenta</h1><p>Elegí tu contraseña para ingresar al portal.</p><form id="activation"><label>Nueva contraseña<input type="password" name="pass" required minlength="10" maxlength="128" autocomplete="new-password"></label><label>Repetí la contraseña<input type="password" name="repeat" required autocomplete="new-password"></label><button>Guardar contraseña</button><p role="status" id="status"></p></form><a href="/portal.html">Volver al portal</a></main><script>
const token=new URLSearchParams(location.hash.slice(1)).get('token');const f=document.getElementById('activation'),status=document.getElementById('status');if(!token){f.querySelector('button').disabled=true;status.textContent='Necesitás el enlace de activación de tu cuenta.';}f.onsubmit=async e=>{e.preventDefault();if(f.elements.pass.value!==f.elements.repeat.value){status.textContent='Las contraseñas no coinciden.';return;}f.querySelector('button').disabled=true;try{const r=await fetch('/api/activate',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({token,pass:f.elements.pass.value})});const d=await r.json();if(!r.ok)throw Error(d.error);history.replaceState(null,'',location.pathname);f.reset();status.textContent='Contraseña guardada. Ya podés ingresar al portal.';}catch(e){status.textContent=e.message;f.querySelector('button').disabled=false;}};
</script></body></html>
