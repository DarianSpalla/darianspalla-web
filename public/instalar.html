<!doctype html><html lang="es"><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>Instalar portal</title>
<body style="max-width:520px;margin:60px auto;font:16px system-ui;padding:20px"><h1>Crear administrador</h1><p>Usá el token privado que configuraste en Hostinger. Esta instalación se cierra cuando existe la primera cuenta.</p>
<form id="setup"><p><input name="token" type="password" placeholder="Token privado de instalación" required style="width:100%"></p><p><input name="name" placeholder="Nombre" required></p><p><input name="email" type="email" placeholder="Email" required></p><p><input name="pass" type="password" minlength="10" placeholder="Contraseña del administrador" required></p><button>Crear administrador</button></form><p id="result" role="status"></p>
<script>document.getElementById('setup').onsubmit=async function(e){e.preventDefault();const result=document.getElementById('result');try{const r=await fetch('/api/index.php?route=setup',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(Object.fromEntries(new FormData(this)))});const d=await r.json();result.textContent=r.ok?'Administrador creado. Entrá en /portal.html y eliminá instalar.html.':d.error;}catch(e){result.textContent='No se pudo conectar con la API PHP.';}};</script></body></html>
